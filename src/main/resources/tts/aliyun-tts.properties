# 使用的模型名称
aliyun-tts.mode=cosyvoice-v3-flash
# 发音人参数
aliyun-tts.voice=longyingmu_v3
# 阿里云百炼 API Key
aliyun-tts.APIKey=
# 首包跳过字节数，例如使用：PCM 8kHz 16bit，那么跳过0.1秒音频就是：8000 * 2 * 0.1 = 1600字节
aliyun-tts.skipBytesInTheFirstPacket=3000
# 尾包跳过字节数，例如使用：PCM 8kHz 16bit，那么跳过0.1秒音频就是：8000 * 2 * 0.1 = 1600字节
aliyun-tts.skipBytesInTheEndPacket=3000