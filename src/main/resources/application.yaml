server:
  # 服务端口
  port: 8080
sip:
  # EasyMrcp要监听的sip服务器地址，填写项目运行的ip地址
  sipServer: 172.16.2.155
  # sip服务器端口
  sipPort: 5060
mrcp:
  # 选择一个asr服务，目前已经集成：xfyun、funasr、aliyun-funasr、tencent-cloud
  asrMode: xfyun
  # 选择一个tts服务，目前已经集成：xfyun、kokoro、tencent-cloud、aliyun
  ttsMode: xfyun
  # MRCP事件处理线程池配置
  event-thread-pool:
    # 核心线程数
    core-pool-size: 8
    # 最大线程数
    max-pool-size: 100
    # 空闲线程最大存活时间（秒）
    keep-alive-seconds: 60
    # 队列容量
    queue-capacity: 1000
tts:
  # TTS处理调度器配置
  process-scheduler:
    # 调度线程池大小
    pool-size: 1
    # 处理轮询间隔（ms）
    interval-ms: 40
rtp:
  # Netty线程池大小，默认为CPU核心数的2倍
  nettyThreads: 8
  asr:
    # ASR 入站 RTP 重排等待窗口，缺失序号在看到这么多个后续包后判定为丢包
    reorderWindowPackets: 2
    # 连续补静音包的最大数量，超过后直接同步到当前可用的下一个真实 RTP 包
    maxConsecutiveLossFill: 3
  asrStartPort: 20000
  asrStopPort: 22000
  # tts的rtp端口范围
  ttsStartPort: 23000
  ttsStopPort: 25000
# FreeSWITCH注册配置
fs:
  register:
    # 是否启用FreeSWITCH注册
    enabled: true
    # FreeSWITCH服务器IP
    server: 172.16.2.205
    # FreeSWITCH SIP端口
    port: 5060
    # 注册用户名
    username: 1020
    # 注册密码
    password: 1020
    # 注册域
    domain: 172.16.2.205
    # 注册间隔(秒)
    interval: 1800
# TCP服务器配置
tcp:
  server:
    # TCP服务器监听端口
    port: 9090
